name: Android CI and releases

on:
  push:
    branches: [main]
    tags: ["alpha-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: Tests and Android checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Configure Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "12266719"
          log-accepted-android-sdk-licenses: "false"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-${{ runner.os }}-1.99.1-${{ hashFiles('native/Cargo.lock') }}
      - name: Install Rust and Linux libraries
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          sudo apt-get update -qq
          sudo apt-get install -y libgl1-mesa-dev libx11-dev
      - name: Native core and JNI tests
        working-directory: native
        run: |
          cargo test --locked -p reloaded-core
          cargo test --locked -p reloaded-jni
      - name: OpenGMK regressions (seven known numerical tests excluded)
        working-directory: native
        run: |
          cargo test --locked -p gm8emulator --lib -- --exact \
            --skip gml::value::tests::op_add \
            --skip math::tests::arccos \
            --skip math::tests::exp \
            --skip math::tests::gt \
            --skip math::tests::lt \
            --skip math::tests::prec_19 \
            --skip math::tests::tan
      - name: Full OpenGMK audit (known numerical failures remain visible)
        id: upstream
        continue-on-error: true
        run: |
          mkdir -p build/ci
          (cd native && cargo test --locked -p gm8emulator --lib) 2>&1 | tee build/ci/opengmk-full.log
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Android unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug
      - name: Record verification scope
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.upstream.outcome }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Alpha verification
          Required checks cover the native core, JNI, Android unit tests/lint and OpenGMK regressions outside seven documented numerical comparisons.
          The excluded comparisons are op_add, arccos, exp, gt, lt, prec_19 and tan. They do not count as passed tests.
          The complete OpenGMK test output is attached as a diagnostic artifact.
          SUMMARY
          if [ "$AUDIT_OUTCOME" = failure ]; then
            echo "::warning::The full OpenGMK audit still has failures; see the attached log and documented alpha limitations."
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-reports
          retention-days: 14
          if-no-files-found: ignore
          path: |
            build/ci/opengmk-full.log
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/

  release:
    name: Signed ARM64 prerelease
    if: startsWith(github.ref, 'refs/tags/alpha-') && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Configure Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "12266719"
          log-accepted-android-sdk-licenses: "false"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-${{ runner.os }}-1.99.1-${{ hashFiles('native/Cargo.lock') }}-android
          restore-keys: rust-${{ runner.os }}-1.99.1-${{ hashFiles('native/Cargo.lock') }}
      - name: Validate tag and release notes
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'alpha-[0-9]+(?:\.[0-9]+)*(?:[-.][A-Za-z0-9]+)*', tag), 'Invalid alpha tag'
          version = re.search(r'versionName\s*=\s*"([^"]+)"', Path('app/build.gradle.kts').read_text()).group(1)
          assert tag == version, f'Tag {tag} differs from versionName {version}'
          assert Path(f'docs/{tag}.md').is_file(), 'Missing release notes'
          PY
      - name: Install Rust and Android toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android
          rustup default 1.99.1
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Build native engine
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          ./scripts/build-native.sh
      - name: Build unsigned release
        run: ./gradlew --no-daemon assembleRelease
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/reloaded-release.p12"
      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/reloaded-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p build/release
          ./scripts/sign-apk.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "build/release/Reloaded-Engine-${RELEASE_TAG}-arm64.apk" \
            > build/release/SIGNING-CERTIFICATE.txt
      - name: Package corresponding source and checksums
        run: |
          git archive --format=zip --prefix="Reloaded-Engine-${RELEASE_TAG}/" \
            --output="build/release/Reloaded-Engine-${RELEASE_TAG}-source.zip" HEAD
          cd build/release
          sha256sum "Reloaded-Engine-${RELEASE_TAG}-arm64.apk" \
            "Reloaded-Engine-${RELEASE_TAG}-source.zip" > SHA256SUMS
      - name: Publish public alpha
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/reloaded-release-state.json" 2>/dev/null; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["isDraft"], "This release is already public; do not overwrite published artifacts"' "$RUNNER_TEMP/reloaded-release-state.json"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "Reloaded Engine ${RELEASE_TAG}" --notes-file "docs/${RELEASE_TAG}.md"
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "build/release/Reloaded-Engine-${RELEASE_TAG}-arm64.apk" \
            "build/release/Reloaded-Engine-${RELEASE_TAG}-source.zip" \
            build/release/SHA256SUMS build/release/SIGNING-CERTIFICATE.txt
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
